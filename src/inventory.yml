storage_servers:
  vars:
    use_cockpit: false
    use_docker_host: false
    use_fiberchannel_target_host: false
    use_stash: false
    use_zfs_host: false

  hosts:
    san0:
      ansible_host: 10.10.100.9
      use_fiberchannel_target_host: true
      fiberchannel_target_host_volume_location: tank/fc_vols
      fiberchannel_target_host_initiators:
        - name: P620_Port1
          id: wwn.10000000C9881AD0
          volumes:
          - name: steam
            size: 2t
            vendor: "FC_NORCO"
            product: "STEAM"
          - name: dev
            size: 2t
            vendor: "FC_NORCO"
            product: "DEV"
        - name: ThunderLink1_Port1
          id: wwn.100000108604660E
          volumes:
          - name: photography
            size: 4t
            vendor: "FC_NORCO"
            product: "PHOTOS"
          - name: work
            size: 1t
            vendor: "FC_NORCO"
            product: "WORK"
          - name: projects
            size: 24t
            vendor: "FC_NORCO"
            product: "PROJECTS"

    nas0:
      ansible_host: 10.10.100.10
      use_stash: true
      use_cockpit: true
      
    hl8:
      ansible_host: 10.10.6.150
      ansible_python_interpreter: /usr/bin/python3
      use_zfs_host: true
      zfs_data_sets:
      - name: tank/docker
        state: present
      - name: tank/Media
        state: present
      - name: tank/Scratch
        state: present
      use_docker_host: true

